<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="TeamBalance: gestão descomplicada de capacidade de equipes"
        />
        <title>TeamBalance · Capacidade em equilíbrio</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #111217;
                --panel: #1b1c24;
                --line: #30313d;
                --muted: #a2a4b7;
                --purple: #ad91ff;
                --green: #65ddc2;
                --yellow: #f4c779;
                --red: #ff929f;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: #f4f3fa;
                font:
                    15px system-ui,
                    -apple-system,
                    sans-serif;
            }

            button,
            input,
            select,
            textarea {
                font: inherit;
            }

            button {
                cursor: pointer;
                border: 1px solid var(--line);
                background: #262731;
                color: inherit;
                border-radius: 10px;
                padding: 10px 15px;
                transition: 0.18s;
            }

            button:hover {
                border-color: var(--purple);
                transform: translateY(-1px);
            }

            button:focus-visible,
            a:focus-visible {
                outline: 3px solid var(--purple);
                outline-offset: 3px;
            }

            .primary {
                background: var(--purple);
                color: #181125;
                border-color: transparent;
                font-weight: 650;
            }

            .danger {
                color: var(--red);
            }

            aside {
                width: 238px;
                position: fixed;
                inset: 0 auto 0 0;
                padding: 34px 22px;
                border-right: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                background: #15161c;
            }

            .brand {
                font-size: 23px;
                letter-spacing: -1px;
                font-weight: 750;
            }

            .brand b {
                color: var(--purple);
            }

            .logo {
                display: inline-grid;
                place-items: center;
                background: var(--purple);
                color: #201333;
                border-radius: 10px;
                width: 34px;
                height: 34px;
                margin-right: 9px;
            }

            nav {
                display: grid;
                gap: 9px;
                margin-top: 52px;
            }

            nav button {
                background: none;
                text-align: left;
                border: 0;
                color: var(--muted);
                padding: 13px;
            }

            nav button.active {
                background: #30283f;
                color: #cfbdff;
            }

            nav span {
                display: inline-block;
                width: 27px;
            }

            aside footer {
                margin-top: auto;
                font-size: 12px;
                line-height: 1.7;
                color: var(--muted);
            }

            aside footer strong {
                color: var(--green);
            }

            main {
                margin-left: 238px;
                padding: 30px 42px;
                max-width: 1660px;
            }

            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 26px;
                border-bottom: 1px solid var(--line);
                color: var(--muted);
                font-size: 13px;
            }

            .top .tag {
                color: var(--green);
                background: #19322e;
                padding: 7px 11px;
                border-radius: 20px;
            }

            .heading {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
                margin: 34px 0 28px;
            }

            h1 {
                font-size: 30px;
                letter-spacing: -1px;
                margin: 0 0 9px;
            }

            h2 {
                font-size: 18px;
                margin: 0;
            }

            h3 {
                margin: 0;
                font-size: 16px;
            }

            p {
                color: var(--muted);
                line-height: 1.6;
                margin: 8px 0;
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 1.6px;
                color: var(--purple);
                text-transform: uppercase;
                margin-bottom: 12px;
            }

            .metrics {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }

            .card {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 15px;
                padding: 22px;
            }

            .metric-label {
                font-size: 13px;
                color: var(--muted);
            }

            .number {
                font-size: 35px;
                font-weight: 650;
                margin: 14px 0 7px;
                letter-spacing: -1px;
            }

            .small {
                font-size: 12px;
                color: var(--muted);
            }

            .grid {
                display: grid;
                grid-template-columns: 1.15fr 1fr;
                gap: 22px;
                margin-top: 24px;
            }

            .cardhead {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 22px;
            }

            .link {
                padding: 0;
                background: none;
                border: 0;
                color: var(--purple);
                font-size: 13px;
            }

            .person {
                padding: 17px 0;
                border-top: 1px solid var(--line);
            }

            .personline {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .identity {
                display: flex;
                align-items: center;
                gap: 11px;
            }

            .avatar {
                display: grid;
                place-items: center;
                width: 37px;
                height: 37px;
                border-radius: 11px;
                background: #353046;
                color: #d2bfff;
                font-size: 12px;
                font-weight: 700;
            }

            .bar {
                height: 7px;
                background: #30313c;
                border-radius: 10px;
                margin: 14px 0 8px;
                overflow: hidden;
            }

            .bar i {
                display: block;
                height: 100%;
                border-radius: 10px;
            }

            .between {
                display: flex;
                justify-content: space-between;
                gap: 10px;
            }

            .badge {
                font-size: 11px;
                padding: 5px 9px;
                border-radius: 6px;
                display: inline-block;
                background: #34303f;
                color: #cdbaff;
            }

            .priority-Alta {
                background: #422a32;
                color: var(--red);
            }

            .priority-Média {
                background: #3e3525;
                color: var(--yellow);
            }

            .priority-Baixa {
                background: #203a34;
                color: var(--green);
            }

            .task {
                padding: 17px 0;
                border-top: 1px solid var(--line);
            }

            .task h3 {
                margin: 10px 0;
            }

            .note {
                border: 1px solid #443955;
                background: #24202f;
                border-radius: 12px;
                padding: 17px 20px;
                margin-top: 24px;
                color: #c1b6d8;
                line-height: 1.6;
                font-size: 13px;
            }

            .actions {
                display: flex;
                gap: 9px;
                flex-wrap: wrap;
            }

            .toolbar {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 22px;
            }

            .toolbar input {
                flex: 1;
                min-width: 170px;
            }

            input,
            select,
            textarea {
                background: #14151b;
                color: #f5f4fa;
                border: 1px solid #3a3b49;
                border-radius: 9px;
                padding: 11px;
                width: 100%;
                outline: none;
            }

            input:focus,
            select:focus,
            textarea:focus {
                border-color: var(--purple);
                box-shadow: 0 0 0 2px #ad91ff22;
            }

            .toolbar select {
                width: auto;
                max-width: 220px;
            }

            textarea {
                resize: vertical;
                min-height: 85px;
            }

            .teamcards {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
            }

            .teamcards .actions {
                margin-top: 20px;
            }

            .empty {
                text-align: center;
                padding: 45px 18px;
                color: var(--muted);
                line-height: 1.8;
            }

            .tablewrap {
                overflow: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                white-space: nowrap;
            }

            th {
                text-align: left;
                color: var(--muted);
                font-weight: 500;
                font-size: 12px;
                padding: 12px;
            }

            td {
                padding: 17px 12px;
                border-top: 1px solid var(--line);
                font-size: 13px;
            }

            td:first-child {
                white-space: normal;
                min-width: 180px;
            }

            .simgrid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }

            .field {
                margin-bottom: 17px;
            }

            .field label {
                display: block;
                font-size: 13px;
                margin-bottom: 8px;
            }

            .error {
                color: var(--red);
                font-size: 12px;
                display: block;
                margin-top: 6px;
            }

            .full {
                grid-column: 1/-1;
            }

            dialog {
                width: 540px;
                max-width: calc(100% - 28px);
                max-height: 90vh;
                overflow: auto;
                background: var(--panel);
                color: inherit;
                border: 1px solid #484051;
                border-radius: 18px;
                padding: 26px;
            }

            dialog::backdrop {
                background: #080910bd;
                backdrop-filter: blur(5px);
            }

            .modalhead {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
            }

            .modalfoot {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 22px;
            }

            .close {
                padding: 3px 9px;
                font-size: 22px;
            }

            .toast {
                position: fixed;
                bottom: 26px;
                right: 26px;
                max-width: calc(100% - 40px);
                background: #293c36;
                border: 1px solid var(--green);
                padding: 15px 22px;
                border-radius: 12px;
                z-index: 10;
                box-shadow: 0 12px 40px #0006;
            }

            .pagefoot {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                margin-top: 35px;
                padding-top: 22px;
                border-top: 1px solid var(--line);
            }

            .inactive {
                opacity: 0.65;
            }

            .legend {
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
                font-size: 11px;
                color: var(--muted);
                margin-top: 20px;
            }

            .dot {
                width: 6px;
                height: 6px;
                display: inline-block;
                border-radius: 50%;
                margin-right: 5px;
            }

            #simResult .number {
                font-size: 48px;
            }

            .hidden {
                display: none !important;
            }

            @media (min-width: 1450px) {
                main {
                    padding: 35px 60px;
                }
            }

            @media (max-width: 1100px) {
                main {
                    padding: 25px;
                }

                aside {
                    width: 205px;
                    padding: 28px 16px;
                }

                main {
                    margin-left: 205px;
                }

                .metrics {
                    grid-template-columns: repeat(2, 1fr);
                }

                .teamcards {
                    grid-template-columns: repeat(2, 1fr);
                }

                .grid {
                    grid-template-columns: 1fr;
                }

                .simgrid {
                    grid-template-columns: 1fr;
                }
            }

            @media (max-width: 700px) {
                aside {
                    position: static;
                    width: 100%;
                    padding: 18px;
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }

                nav {
                    display: flex;
                    margin-top: 18px;
                    gap: 3px;
                    overflow: auto;
                }

                nav button {
                    white-space: nowrap;
                    padding: 10px;
                    font-size: 12px;
                }

                nav span {
                    width: 18px;
                }

                aside footer {
                    display: none;
                }

                main {
                    margin: 0;
                    padding: 20px 16px;
                }

                .top {
                    padding-bottom: 18px;
                }

                .heading {
                    align-items: flex-start;
                    flex-direction: column;
                    margin: 25px 0;
                }

                h1 {
                    font-size: 27px;
                }

                .metrics {
                    gap: 10px;
                }

                .card {
                    padding: 17px;
                }

                .number {
                    font-size: 30px;
                }

                .teamcards {
                    grid-template-columns: 1fr;
                }

                .fields {
                    grid-template-columns: 1fr;
                }

                .toolbar select {
                    max-width: none;
                    flex: 1;
                    min-width: 135px;
                }

                .pagefoot {
                    align-items: flex-start;
                    flex-direction: column;
                }

                .top .tag {
                    font-size: 11px;
                }

                .simgrid {
                    gap: 16px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>

    <body>
        <aside>
            <div class="brand"><span class="logo">≋</span>Team<b>Balance</b></div>
            <nav aria-label="Navegação principal">
                <button data-page="overview" class="active"><span>◫</span> Visão geral</button
                ><button data-page="team"><span>♧</span> Minha equipe</button
                ><button data-page="tasks"><span>☷</span> Atividades</button
                ><button data-page="sim"><span>⇄</span> Simulador</button>
            </nav>
            <footer>
                <strong>● Tudo salvo neste navegador</strong><br />Mais clareza. Mais equilíbrio.<br /><br />TeamBalance
                · Projeto educacional
            </footer>
        </aside>
        <main>
            <div class="top">
                <span>Workspace / <span id="breadcrumb">Visão geral</span></span
                ><span class="tag">● Gestão com mais leveza</span>
            </div>
            <div id="app"></div>
            <div class="pagefoot">
                <span class="small">Seus dados ficam apenas neste navegador.</span>
                <div class="actions">
                    <button id="demo">Carregar dados de exemplo</button
                    ><button class="danger" id="reset">Restaurar aplicação</button>
                </div>
            </div>
        </main>
        <dialog id="modal" aria-labelledby="modalTitle"></dialog>
        <dialog id="confirm" aria-labelledby="confirmTitle"></dialog>
        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
        <script>
            "use strict";
            const KEY = "teambalance.v1",
                $ = (s) => document.querySelector(s),
                esc = (v) =>
                    String(v ?? "").replace(
                        /[&<>"']/g,
                        (c) =>
                            ({
                                "&": "&amp;",
                                "<": "&lt;",
                                ">": "&gt;",
                                '"': "&quot;",
                                "'": "&#39;",
                            })[c],
                    );
            const priorities = ["Baixa", "Média", "Alta"],
                statuses = ["Pendente", "Em andamento", "Concluída", "Cancelada"];
            let db = { people: [], tasks: [] },
                page = "overview",
                filters = { q: "", person: "", priority: "", status: "" };
            const fmt = (n) => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 }),
                today = () => {
                    let d = new Date();
                    return (
                        d.getFullYear() +
                        "-" +
                        String(d.getMonth() + 1).padStart(2, "0") +
                        "-" +
                        String(d.getDate()).padStart(2, "0")
                    );
                },
                clean = (s) =>
                    String(s ?? "")
                        .trim()
                        .replace(/\s+/g, " "),
                norm = (s) => clean(s).toLocaleLowerCase("pt-BR"),
                uid = () =>
                    globalThis.crypto?.randomUUID?.() ||
                    Date.now().toString(36) + Math.random().toString(36).slice(2),
                openTask = (t) => ["Pendente", "Em andamento"].includes(t.status),
                loadFor = (id, data = db) =>
                    data.tasks
                        .filter((t) => t.person === id && openTask(t))
                        .reduce((s, t) => s + t.hours, 0),
                utilization = (p) => (loadFor(p.id) / p.capacity) * 100,
                color = (n) =>
                    n > 100 ? "var(--red)" : n >= 70 ? "var(--yellow)" : "var(--green)",
                classification = (n) =>
                    n > 100
                        ? "Sobrecarga"
                        : n >= 70
                          ? "Atenção à capacidade"
                          : "Disponibilidade confortável",
                dateLabel = (d) => new Date(d + "T12:00:00").toLocaleDateString("pt-BR"),
                initials = (n) =>
                    n
                        .split(" ")
                        .filter(Boolean)
                        .slice(0, 2)
                        .map((x) => x[0])
                        .join("");
            function toast(msg, error = false) {
                let el = $("#toast");
                el.textContent = msg;
                el.style.borderColor = error ? "var(--red)" : "var(--green)";
                el.classList.remove("hidden");
                clearTimeout(toast.timer);
                toast.timer = setTimeout(() => el.classList.add("hidden"), 4500);
            }
            try {
                const raw = localStorage.getItem(KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed.people) || !Array.isArray(parsed.tasks))
                        throw Error();
                    db = parsed;
                }
            } catch {
                setTimeout(
                    () =>
                        toast(
                            "Não foi possível ler os dados salvos. Restaure a aplicação para começar novamente.",
                            true,
                        ),
                    0,
                );
            }
            function commit(next) {
                try {
                    localStorage.setItem(KEY, JSON.stringify(next));
                    db = next;
                    render();
                    return true;
                } catch {
                    toast(
                        "Não foi possível salvar. Verifique o espaço e a permissão de armazenamento do navegador.",
                        true,
                    );
                    return false;
                }
            }
            function ask(title, message, label = "Confirmar", danger = false) {
                return new Promise((resolve) => {
                    const d = $("#confirm");
                    d.innerHTML = `<h2 id="confirmTitle">${esc(title)}</h2><p>${esc(message)}</p><div class="modalfoot"><button data-no>Voltar</button><button data-yes class="${danger ? "danger" : "primary"}">${esc(label)}</button></div>`;
                    d.oncancel = (e) => {
                        e.preventDefault();
                        d.close();
                        resolve(false);
                    };
                    d.querySelector("[data-no]").onclick = () => {
                        d.close();
                        resolve(false);
                    };
                    d.querySelector("[data-yes]").onclick = () => {
                        d.close();
                        resolve(true);
                    };
                    d.showModal();
                });
            }
            function navigate(p) {
                page = p;
                render();
            }
            $("nav").onclick = (e) => {
                const b = e.target.closest("[data-page]");
                if (b) navigate(b.dataset.page);
            };
            function header(title, sub, action = "") {
                return `<div class="heading"><div><div class="eyebrow">Capacidade em equilíbrio</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;
            }
            function meter(p) {
                const h = loadFor(p.id),
                    u = utilization(p);
                return `<div class="bar" role="img" aria-label="Utilização de ${fmt(u)} por cento"><i style="width:${Math.min(u, 100)}%;background:${color(u)}"></i></div><div class="between small"><span>${fmt(h)}h de ${fmt(p.capacity)}h alocadas</span><span style="color:${color(u)}">${fmt(u)}%</span></div>`;
            }
            function identity(p) {
                return `<div class="identity"><span class="avatar">${esc(initials(p.name))}</span><div><h3>${esc(p.name)}</h3><div class="small">${esc(p.role)}</div></div></div>`;
            }
            function render() {
                const names = {
                    overview: "Visão geral",
                    team: "Minha equipe",
                    tasks: "Atividades",
                    sim: "Simulador",
                };
                $("#breadcrumb").textContent = names[page];
                document
                    .querySelectorAll("nav button")
                    .forEach((b) => b.classList.toggle("active", b.dataset.page === page));
                $("#app").innerHTML = {
                    overview: overview,
                    team: team,
                    tasks: tasks,
                    sim: simulator,
                }[page]();
                bind();
            }
            function overview() {
                const active = db.people.filter((p) => p.active),
                    pending = db.tasks.filter(openTask),
                    over = active.filter((p) => utilization(p) > 100).length,
                    avg = active.length
                        ? active.reduce((s, p) => s + utilization(p), 0) / active.length
                        : 0;
                const high = pending
                    .slice()
                    .sort(
                        (a, b) =>
                            priorities.indexOf(b.priority) - priorities.indexOf(a.priority) ||
                            a.due.localeCompare(b.due),
                    )
                    .slice(0, 4);
                return (
                    header(
                        "Um olhar para o seu time",
                        "Encontre o equilíbrio entre as entregas e as pessoas.",
                        '<button class="primary" data-newtask>＋ Nova atividade</button>',
                    ) +
                    `<div class="metrics">${[
                        [
                            "Colaboradores ativos",
                            active.length,
                            "Pessoas que fazem acontecer",
                            "var(--purple)",
                        ],
                        [
                            "Atividades em aberto",
                            pending.length,
                            "Pendentes e em andamento",
                            "var(--green)",
                        ],
                        ["Em sobrecarga", over, "Colaboradores acima de 100%", "var(--red)"],
                        [
                            "Utilização média",
                            fmt(avg) + "%",
                            "Considera somente o time ativo",
                            "var(--yellow)",
                        ],
                    ]
                        .map(
                            ([l, n, s, c]) =>
                                `<div class="card"><div class="metric-label">${l}</div><div class="number" style="color:${c}">${n}</div><div class="small">${s}</div></div>`,
                        )
                        .join(
                            "",
                        )}</div><div class="grid"><section class="card"><div class="cardhead"><h2>Como está a carga do time?</h2><button class="link" data-go="team">Ver equipe ↗</button></div>${active.length ? active.map((p) => `<div class="person"><div class="personline">${identity(p)}<span class="small" style="color:${color(utilization(p))}">${classification(utilization(p))}</span></div>${meter(p)}</div>`).join("") : '<div class="empty">Seu time começa por aqui.<br>Cadastre colaboradores ou carregue os dados de exemplo.</div>'}<div class="legend"><span><i class="dot" style="background:var(--green)"></i>Abaixo de 70%</span><span><i class="dot" style="background:var(--yellow)"></i>70% a 100%</span><span><i class="dot" style="background:var(--red)"></i>Acima de 100%</span></div></section><section class="card"><div class="cardhead"><h2>No radar de prioridades</h2><button class="link" data-go="tasks">Ver atividades ↗</button></div>${high.length ? high.map((t) => `<div class="task"><div class="between"><span class="badge priority-${t.priority}">${t.priority}</span><span class="small">${dateLabel(t.due)}${t.due < today() ? " · Em atraso" : ""}</span></div><h3>${esc(t.title)}</h3><div class="between small"><span>${esc(db.people.find((p) => p.id === t.person)?.name || "Sem responsável")}</span><span>${fmt(t.hours)}h · ${t.status}</span></div></div>`).join("") : '<div class="empty">Tudo tranquilo por aqui.<br>Suas próximas atividades aparecerão neste espaço.</div>'}</section></div><div class="note">↗ <strong>Planeje antes de distribuir.</strong> Use o simulador para entender o impacto de uma nova atividade na capacidade do time. A carga é agregada, sem divisão por semana ou dia.</div>`
                );
            }
            function team() {
                return (
                    header(
                        "Pessoas no centro",
                        "Acompanhe a disponibilidade e cuide do ritmo da equipe.",
                        '<button class="primary" id="newperson">＋ Novo colaborador</button>',
                    ) +
                    `<div class="teamcards">${
                        db.people.length
                            ? db.people
                                  .map((p) => {
                                      let h = loadFor(p.id),
                                          u = utilization(p);
                                      return `<article class="card ${p.active ? "" : "inactive"}"><div class="between">${identity(p)}<span class="badge">${p.active ? "Ativo" : "Inativo"}</span></div>${meter(p)}<p class="small" style="color:${color(u)}">${classification(u)}</p><div class="between"><p class="small">Disponíveis <strong>${fmt(p.capacity - h)}h</strong></p><p class="small">Capacidade ${fmt(p.capacity)}h</p></div><div class="actions"><button data-editperson="${p.id}">Editar</button><button data-toggle="${p.id}">${p.active ? "Desativar" : "Ativar"}</button></div></article>`;
                                  })
                                  .join("")
                            : '<div class="card empty full">Seu time ainda está vazio. Que tal cadastrar a primeira pessoa?</div>'
                    }</div><div class="note">A desativação impede novas atribuições e mantém o histórico e a carga existente. Colaboradores inativos ficam fora da média da equipe.</div>`
                );
            }
            function options(values, selected, placeholder = "Selecione") {
                return (
                    `<option value="">${placeholder}</option>` +
                    values
                        .map((v) => {
                            let value = typeof v === "string" ? v : v.id,
                                label = typeof v === "string" ? v : v.name;
                            return `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(label)}</option>`;
                        })
                        .join("")
                );
            }
            function filteredTasks() {
                return db.tasks.filter(
                    (t) =>
                        (!filters.q || norm(t.title).includes(norm(filters.q))) &&
                        (!filters.person || t.person === filters.person) &&
                        (!filters.priority || t.priority === filters.priority) &&
                        (!filters.status || t.status === filters.status),
                );
            }
            function taskRows() {
                return (
                    filteredTasks()
                        .map(
                            (t) =>
                                `<tr><td><strong>${esc(t.title)}</strong>${t.description ? `<p class="small">${esc(t.description)}</p>` : ""}</td><td>${esc(db.people.find((p) => p.id === t.person)?.name || "—")}</td><td>${fmt(t.hours)}h</td><td><span class="badge priority-${t.priority}">${t.priority}</span></td><td>${dateLabel(t.due)}${t.due < today() && openTask(t) ? '<div class="small danger">Em atraso</div>' : ""}</td><td>${t.status}</td><td><div class="actions"><button data-edittask="${t.id}" aria-label="Editar ${esc(t.title)}">Editar</button><button class="danger" data-delete="${t.id}" aria-label="Excluir ${esc(t.title)}">Excluir</button></div></td></tr>`,
                        )
                        .join("") ||
                    '<tr><td colspan="7" class="empty">Nenhuma atividade encontrada. Crie uma atividade ou ajuste os filtros.</td></tr>'
                );
            }
            function tasks() {
                return (
                    header(
                        "Cada entrega, no seu lugar",
                        "Organize as atividades e mantenha a carga de trabalho visível.",
                        '<button class="primary" data-newtask>＋ Nova atividade</button>',
                    ) +
                    `<div class="toolbar"><input id="search" aria-label="Pesquisar pelo título" placeholder="⌕ Pesquisar pelo título…" value="${esc(filters.q)}"><select id="filterPerson" aria-label="Filtrar responsável">${options(db.people, filters.person, "Todos os responsáveis")}</select><select id="filterPriority" aria-label="Filtrar prioridade">${options(priorities, filters.priority, "Todas as prioridades")}</select><select id="filterStatus" aria-label="Filtrar status">${options(statuses, filters.status, "Todos os status")}</select><button id="clear">Limpar filtros</button></div><div class="card tablewrap"><table><thead><tr><th>Atividade</th><th>Responsável</th><th>Esforço</th><th>Prioridade</th><th>Prazo</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows">${taskRows()}</tbody></table></div>`
                );
            }
            function field(name, label, control) {
                return `<div class="field"><label for="${name}">${label}</label>${control}<span class="error" id="error-${name}"></span></div>`;
            }
            function showModal(title, body, onSubmit) {
                const d = $("#modal");
                d.innerHTML = `<div class="modalhead"><h2 id="modalTitle">${title}</h2><button type="button" class="close" aria-label="Fechar">×</button></div><form novalidate>${body}<div class="modalfoot"><button type="button" class="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form>`;
                d.querySelector(".close").onclick = d.querySelector(".cancel").onclick = () =>
                    d.close();
                d.querySelector("form").onsubmit = (e) => {
                    e.preventDefault();
                    onSubmit(new FormData(e.target));
                };
                d.showModal();
            }
            function errors(err) {
                document.querySelectorAll("#modal .error").forEach((e) => (e.textContent = ""));
                for (const [key, value] of Object.entries(err)) {
                    const el = $("#error-" + key);
                    if (el) {
                        el.textContent = value;
                        const input = document.getElementById(key);
                        input?.setAttribute("aria-invalid", "true");
                        input?.setAttribute("aria-describedby", "error-" + key);
                    }
                }
                if (Object.keys(err).length) {
                    document.getElementById(Object.keys(err)[0])?.focus();
                    return true;
                }
                return false;
            }
            function validatePerson(p, id) {
                let e = {};
                if (!p.name) e.name = "Informe o nome.";
                else if (db.people.some((x) => x.id !== id && norm(x.name) === norm(p.name)))
                    e.name = "Já existe um colaborador com esse nome.";
                if (!p.role) e.role = "Informe a função.";
                if (!Number.isFinite(p.capacity) || p.capacity <= 0 || p.capacity > 168)
                    e.capacity = "Informe uma capacidade maior que 0 e de até 168 horas.";
                return e;
            }
            function editPerson(id) {
                let p = db.people.find((p) => p.id === id) || { name: "", role: "", capacity: 40 };
                showModal(
                    id ? "Editar colaborador" : "Uma nova pessoa no time",
                    field(
                        "name",
                        "Nome *",
                        `<input id="name" name="name" required value="${esc(p.name)}" autocomplete="name">`,
                    ) +
                        field(
                            "role",
                            "Função *",
                            `<input id="role" name="role" required value="${esc(p.role)}">`,
                        ) +
                        field(
                            "capacity",
                            "Capacidade semanal (horas) *",
                            `<input id="capacity" name="capacity" type="number" min="0.01" max="168" step="any" required value="${p.capacity}">`,
                        ),
                    (fd) => {
                        const next = {
                            ...p,
                            id: id || uid(),
                            name: clean(fd.get("name")),
                            role: clean(fd.get("role")),
                            capacity: Number(fd.get("capacity")),
                            active: id ? p.active : true,
                        };
                        if (errors(validatePerson(next, id))) return;
                        const data = {
                            ...db,
                            people: id
                                ? db.people.map((x) => (x.id === id ? next : x))
                                : [...db.people, next],
                        };
                        if (commit(data)) {
                            $("#modal").close();
                            toast("Colaborador salvo com sucesso.");
                        }
                    },
                );
            }
            function validateTask(t, old) {
                let e = {};
                if (!t.title) e.title = "Informe o título.";
                const p = db.people.find((x) => x.id === t.person);
                if (!p) e.person = "Selecione um responsável.";
                else if (!p.active && (!old || old.person !== p.id))
                    e.person = "Selecione um colaborador ativo.";
                if (!Number.isFinite(t.hours) || t.hours <= 0)
                    e.hours = "O esforço deve ser maior que zero.";
                if (!priorities.includes(t.priority)) e.priority = "Selecione uma prioridade.";
                if (!statuses.includes(t.status)) e.status = "Selecione um status.";
                if (
                    !/^\d{4}-\d{2}-\d{2}$/.test(t.due) ||
                    !Number.isFinite(Date.parse(t.due + "T12:00:00")) ||
                    new Date(t.due + "T12:00:00").toISOString().slice(0, 10) !== t.due
                )
                    e.due = "Informe um prazo válido.";
                else if (!old && t.due < today()) e.due = "O prazo não pode ser anterior a hoje.";
                return e;
            }
            function taskFields(t) {
                let people = db.people
                    .filter((p) => p.active || p.id === t.person)
                    .map((p) => ({ ...p, name: p.name + (p.active ? "" : " (inativo)") }));
                return (
                    field(
                        "title",
                        "Título *",
                        `<input id="title" name="title" value="${esc(t.title)}" required>`,
                    ) +
                    field(
                        "description",
                        "Descrição (opcional)",
                        `<textarea id="description" name="description">${esc(t.description)}</textarea>`,
                    ) +
                    field(
                        "person",
                        "Responsável *",
                        `<select id="person" name="person" required>${options(people, t.person)}</select>`,
                    ) +
                    `<div class="fields">${field("hours", "Esforço estimado (horas) *", `<input id="hours" name="hours" type="number" min="0.01" step="any" required value="${t.hours || ""}">`)}${field("priority", "Prioridade *", `<select id="priority" name="priority" required>${options(priorities, t.priority)}</select>`)}${field("due", "Prazo *", `<input id="due" name="due" type="date" ${t.id ? "" : `min="${today()}"`} required value="${esc(t.due)}">`)}${field("status", "Status *", `<select id="status" name="status" required>${options(statuses, t.status)}</select>`)}</div>`
                );
            }
            function taskFromForm(fd, old) {
                return {
                    id: old?.id || uid(),
                    title: clean(fd.get("title")),
                    description: String(fd.get("description") || "").trim(),
                    person: String(fd.get("person") || ""),
                    hours: Number(fd.get("hours")),
                    priority: fd.get("priority"),
                    due: fd.get("due"),
                    status: fd.get("status"),
                };
            }
            function editTask(id, preset) {
                let old = db.tasks.find((x) => x.id === id),
                    t = old || {
                        title: "",
                        description: "",
                        person: "",
                        hours: "",
                        priority: "Média",
                        due: today(),
                        status: "Pendente",
                        ...preset,
                    };
                if (!old && !db.people.some((p) => p.active)) {
                    toast("Cadastre ou ative um colaborador antes de criar uma atividade.", true);
                    return;
                }
                showModal(old ? "Editar atividade" : "Nova atividade", taskFields(t), (fd) => {
                    const n = taskFromForm(fd, old);
                    if (errors(validateTask(n, old))) return;
                    if (
                        commit({
                            ...db,
                            tasks: old
                                ? db.tasks.map((x) => (x.id === old.id ? n : x))
                                : [...db.tasks, n],
                        })
                    ) {
                        $("#modal").close();
                        toast("Atividade salva. Capacidade atualizada.");
                    }
                });
            }
            function simulator() {
                return (
                    header(
                        "Distribua com mais confiança",
                        "Veja o impacto de uma nova atividade antes de confirmar.",
                    ) +
                    `<div class="simgrid"><section class="card"><div class="cardhead"><h2>Experimente uma distribuição</h2><span class="badge">Simulação</span></div>${field(
                        "simPerson",
                        "Colaborador ativo",
                        `<select id="simPerson">${options(
                            db.people.filter((p) => p.active),
                            "",
                            "Selecione uma pessoa",
                        )}</select>`,
                    )}${field("simHours", "Esforço da nova atividade (horas)", `<input id="simHours" type="number" min="0.01" step="any" placeholder="Ex.: 8">`)}<p class="small">Nenhum dado é alterado até a confirmação final.</p><button class="primary" id="simConfirm" style="margin-top:20px;width:100%">Continuar distribuição →</button></section><section class="card" id="simResult"><div class="empty">⇄<br>Um pequeno teste. Uma decisão mais clara.<br>Selecione uma pessoa e informe o esforço.</div></section></div><div class="note">A capacidade considera todas as atividades pendentes e em andamento. Atividades concluídas e canceladas liberam horas automaticamente.</div>`
                );
            }
            function simData() {
                const person = db.people.find((p) => p.id === $("#simPerson")?.value && p.active),
                    hours = Number($("#simHours")?.value);
                return { person, hours, valid: !!person && Number.isFinite(hours) && hours > 0 };
            }
            function updateSimulation() {
                const { person: p, hours, valid } = simData();
                if (!valid) {
                    $("#simResult").innerHTML =
                        '<div class="empty">Selecione um colaborador ativo e informe um esforço maior que zero.</div>';
                    return;
                }
                const current = loadFor(p.id),
                    projected = current + hours,
                    u = (projected / p.capacity) * 100;
                $("#simResult").innerHTML =
                    `<div class="eyebrow">Cenário projetado</div><h2>${esc(p.name)}</h2><div class="number" style="color:${color(u)}">${fmt(u)}<span style="font-size:22px">%</span></div><p style="color:${color(u)}">${classification(u)}</p><div class="bar"><i style="width:${Math.min(u, 100)}%;background:${color(u)}"></i></div><div class="person between"><span>Capacidade semanal</span><strong>${fmt(p.capacity)}h</strong></div><div class="person between"><span>Carga atual</span><strong>${fmt(current)}h · ${fmt((current / p.capacity) * 100)}%</strong></div><div class="person between"><span>Carga projetada</span><strong>${fmt(projected)}h</strong></div><div class="person between"><span>Disponibilidade após distribuição</span><strong style="color:${color(u)}">${fmt(p.capacity - projected)}h</strong></div>${u > 100 ? `<p class="danger">Esta atividade ultrapassa a capacidade em ${fmt(projected - p.capacity)}h. A confirmação explícita será necessária para salvar.</p>` : '<p class="small">Confira os dados e continue para cadastrar a atividade.</p>'}`;
            }
            function confirmSimulation() {
                const { person, hours, valid } = simData();
                if (!valid) {
                    $("#error-simPerson").textContent = person
                        ? ""
                        : "Selecione um colaborador ativo.";
                    $("#error-simHours").textContent =
                        Number.isFinite(hours) && hours > 0
                            ? ""
                            : "Informe um esforço maior que zero.";
                    return;
                }
                let t = {
                    title: "",
                    description: "",
                    person: person.id,
                    hours,
                    priority: "Média",
                    due: today(),
                    status: "Pendente",
                };
                showModal("Confirmar distribuição", taskFields(t), async (fd) => {
                    const n = taskFromForm(fd);
                    if (errors(validateTask(n))) return;
                    const p = db.people.find((x) => x.id === n.person),
                        u = ((loadFor(p.id) + (openTask(n) ? n.hours : 0)) / p.capacity) * 100;
                    if (
                        u > 100 &&
                        openTask(n) &&
                        !(await ask(
                            "Confirmar sobrecarga?",
                            `${p.name} ficará com ${fmt(u)}% de utilização. Deseja distribuir esta atividade mesmo assim?`,
                            "Confirmar com sobrecarga",
                            true,
                        ))
                    )
                        return;
                    if (commit({ ...db, tasks: [...db.tasks, n] })) {
                        $("#modal").close();
                        toast("Distribuição confirmada. Atividade cadastrada.");
                    }
                });
            }
            function bind() {
                document
                    .querySelectorAll("[data-go]")
                    .forEach((b) => (b.onclick = () => navigate(b.dataset.go)));
                document
                    .querySelectorAll("[data-newtask]")
                    .forEach((b) => (b.onclick = () => editTask()));
                $("#newperson")?.addEventListener("click", () => editPerson());
                if (page === "tasks") {
                    for (const [id, k] of [
                        ["search", "q"],
                        ["filterPerson", "person"],
                        ["filterPriority", "priority"],
                        ["filterStatus", "status"],
                    ])
                        $("#" + id).addEventListener("input", (e) => {
                            filters[k] = e.target.value;
                            $("#rows").innerHTML = taskRows();
                        });
                    $("#clear").onclick = () => {
                        filters = { q: "", person: "", priority: "", status: "" };
                        render();
                    };
                }
                if (page === "sim") {
                    $("#simPerson").onchange = $("#simHours").oninput = updateSimulation;
                    $("#simConfirm").onclick = confirmSimulation;
                }
            }
            $("#app").addEventListener("click", async (e) => {
                const b = e.target.closest("button");
                if (!b) return;
                if (b.dataset.editperson) editPerson(b.dataset.editperson);
                if (b.dataset.edittask) editTask(b.dataset.edittask);
                if (b.dataset.toggle) {
                    const p = db.people.find((x) => x.id === b.dataset.toggle);
                    if (
                        p.active &&
                        !(await ask(
                            "Desativar colaborador?",
                            `${p.name} não poderá receber novas atividades. As atividades e a carga existentes serão mantidas.`,
                            "Desativar",
                        ))
                    )
                        return;
                    if (
                        commit({
                            ...db,
                            people: db.people.map((x) =>
                                x.id === p.id ? { ...x, active: !x.active } : x,
                            ),
                        })
                    )
                        toast(p.active ? "Colaborador desativado." : "Colaborador ativado.");
                }
                if (b.dataset.delete) {
                    const t = db.tasks.find((x) => x.id === b.dataset.delete);
                    if (
                        await ask(
                            "Excluir atividade?",
                            `A atividade “${t.title}” será removida. Essa ação não pode ser desfeita.`,
                            "Excluir atividade",
                            true,
                        )
                    ) {
                        if (commit({ ...db, tasks: db.tasks.filter((x) => x.id !== t.id) }))
                            toast("Atividade excluída. Capacidade atualizada.");
                    }
                }
            });
            $("#demo").onclick = async () => {
                if (
                    (db.people.length || db.tasks.length) &&
                    !(await ask(
                        "Substituir os dados atuais?",
                        "Os registros atuais serão substituídos pelos exemplos. Essa ação não pode ser desfeita.",
                        "Carregar exemplos",
                        true,
                    ))
                )
                    return;
                const people = [
                    ["Ana Souza", "Product Designer", 40],
                    ["Bruno Lima", "Desenvolvedor", 40],
                    ["Camila Santos", "Analista de QA", 40],
                    ["Diego Costa", "Product Manager", 32],
                    ["Luiza Ribeiro", "Desenvolvedora", 40],
                ].map(([name, role, capacity]) => ({
                    id: uid(),
                    name,
                    role,
                    capacity,
                    active: true,
                }));
                const specs = [
                    ["Redesenhar fluxo de onboarding", 0, 16, "Alta", "Em andamento"],
                    ["Pesquisa com usuários", 0, 8, "Média", "Pendente"],
                    ["Implementar integração de pagamentos", 1, 28, "Alta", "Em andamento"],
                    ["Ajustar autenticação", 1, 10, "Média", "Pendente"],
                    ["Validar jornada de compra", 2, 32, "Alta", "Em andamento"],
                    ["Executar regressão da versão", 2, 16, "Alta", "Pendente"],
                    ["Planejar próximo ciclo", 3, 16, "Média", "Pendente"],
                    ["Revisar critérios de aceite", 3, 6, "Baixa", "Concluída"],
                    ["Melhorar acessibilidade", 4, 20, "Média", "Em andamento"],
                    ["Atualizar biblioteca legada", 4, 12, "Baixa", "Cancelada"],
                ];
                const tasks = specs.map(([title, i, hours, priority, status], n) => {
                    let date = new Date();
                    date.setDate(date.getDate() + n + 1);
                    let due =
                        date.getFullYear() +
                        "-" +
                        String(date.getMonth() + 1).padStart(2, "0") +
                        "-" +
                        String(date.getDate()).padStart(2, "0");
                    return {
                        id: uid(),
                        title,
                        description: "",
                        person: people[i].id,
                        hours,
                        priority,
                        status,
                        due,
                    };
                });
                if (commit({ people, tasks }))
                    toast("Dados de exemplo carregados. Explore à vontade!");
            };
            $("#reset").onclick = async () => {
                if (
                    await ask(
                        "Restaurar aplicação?",
                        "Todos os colaboradores e atividades deste aplicativo serão apagados neste navegador. Essa ação não pode ser desfeita.",
                        "Apagar todos os dados",
                        true,
                    )
                ) {
                    try {
                        localStorage.removeItem(KEY);
                        db = { people: [], tasks: [] };
                        filters = { q: "", person: "", priority: "", status: "" };
                        render();
                        toast("Aplicação restaurada. Pronta para um novo começo.");
                    } catch {
                        toast("Não foi possível apagar os dados locais.", true);
                    }
                }
            };
            render();
        </script>
    </body>
</html>
